name: Build Android APK

on:
  push:
    branches: [ "main", "master", "diagnostic-switch-fix" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          
      - name: Build APK (Without Wrapper)
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteGallery-App
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diagnostic-switch-fix-${{ github.run_number }}
          name: diagnostic-switch-fix-${{ github.run_number }}
          body: "自动构建版。从设置 → 检查更新 安装。"
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
