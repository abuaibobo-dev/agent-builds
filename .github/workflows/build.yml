name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
          
      - name: Build APK (Without Wrapper)
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Run Unit Tests
        run: gradle testDebugUnitTest -PbuildNumber=${{ github.run_number }}

      - name: Set Date
        run: echo "APK_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Package APK
        run: |
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/release/collector-${{ env.APK_DATE }}-build-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: collector-${{ env.APK_DATE }}-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/collector-*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: collector-mvp-${{ github.run_number }}
          name: collector ${{ github.run_number }} (${{ env.APK_DATE }})
          body: "Telegram channel media collector MVP: TDLib login, history sync via copyMessages, four-tab UI, foreground service."
          files: app/build/outputs/apk/release/collector-*.apk
          prerelease: true
