name: build-agent
on:
  push:
    branches: ['agent-build/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --max-workers=2
      - name: Create release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found: $APK"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --title "Agent Build $TAG" --notes "由 Synaps 引擎自动提交构建"
          echo "::notice::直链 https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-debug.apk"

