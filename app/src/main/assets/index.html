<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>B Collector</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="brand-mark">B</div>
      <div class="splash-bar"><span></span></div>
    </div>

    <div class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">B Collector · v4</div>
          <h1 id="page-title">控制台</h1>
        </div>
        <div class="status-pill" id="status-pill">待登录</div>
      </header>

      <main id="app" class="app"></main>

      <nav class="bottom-nav" aria-label="主导航">
        <button data-page="targets">目标</button>
        <button data-page="collect">采集</button>
        <button data-page="console" class="is-active">控制台</button>
        <button data-page="ads">广告</button>
        <button data-page="settings">设置</button>
      </nav>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
